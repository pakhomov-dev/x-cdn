services:
  xcdn:
    build: .
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./public:/app/public
      - ./config.yaml:/app/config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
